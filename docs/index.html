<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bangtyper.</title>
  <meta name="description" content="Desktop typing test for Windows. Download the latest release on GitHub." />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e8e4dc;
      --gold: #c4a574;
      --muted: #9a958c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #1a1610 0%, transparent 55%),
        var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    main { max-width: 28rem; text-align: center; }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--gold);
    }
    p { margin: 0 0 1.5rem; line-height: 1.5; color: var(--muted); }
    a.cta {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border: 1px solid var(--gold);
      color: var(--bg);
      background: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    a.cta:hover { filter: brightness(1.08); }
    a.secondary {
      display: inline-block;
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    a.secondary:hover { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>bangtyper.</h1>
    <p>Desktop typing test for Windows. Three modes, optional timer, results graphs. Source and docs live on GitHub.</p>
    <a class="cta" href="https://github.com/Xiliank/bangtyper/releases/latest">Download latest release</a>
    <br />
    <a class="secondary" href="https://github.com/Xiliank/bangtyper">View source on GitHub</a>
  </main>
</body>
</html>
